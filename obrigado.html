<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Obrigado | Efeito Harmonia</title>
<style>
  :root{
    --roxo: #6c4ab6;
    --roxo-escuro: #4a2e8f;
    --rosa: #e85d9c;
    --fundo: #f6f3fb;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(160deg, var(--fundo) 0%, #ece3f9 100%);
    color:#2e2438;
    position:relative;
    padding: 20px;
  }
  .marca-canto{
    position: fixed;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--roxo-escuro);
    opacity: 0.55;
    font-size: 13px;
    text-transform: uppercase;
  }
  .top-left{ top: 14px; left: 18px; }
  .bottom-right{ bottom: 14px; right: 18px; }

  .card{
    background:#fff;
    border-radius:18px;
    box-shadow: 0 10px 35px rgba(74,46,143,0.15);
    padding: 44px 36px;
    text-align:center;
    max-width: 420px;
  }
  .icone{
    width:64px;height:64px;
    border-radius:50%;
    background: linear-gradient(135deg, var(--roxo), var(--rosa));
    display:flex;align-items:center;justify-content:center;
    margin: 0 auto 18px;
    font-size:30px;
    color:#fff;
  }
  h1{ font-size:22px; color:var(--roxo-escuro); margin:0 0 10px; }
  p{ font-size:14.5px; color:#6a5d80; line-height:1.6; }
  .selo{
    display:inline-block;
    margin-top:18px;
    font-size:12px;
    font-weight:700;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color: var(--roxo);
  }
</style>
</head>
<body>
  <div class="marca-canto top-left">Efeito Harmonia</div>
  <div class="marca-canto bottom-right">Efeito Harmonia</div>

  <div class="card">
    <div class="icone">✓</div>
    <h1>Resposta enviada!</h1>
    <p>Obrigado por participar da pesquisa sobre bullying e racismo. Sua contribuição é muito importante para o trabalho do grupo <strong>Efeito Harmonia</strong>.</p>
    <div class="selo">Efeito Harmonia</div>
  </div>
</body>
</html>
